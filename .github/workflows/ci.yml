name: Frontend CI

on:
  push:
    branches: [main, nitindev, 'feature/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The app must build; lint is reported but does not block yet (the
      # existing code has known lint findings).
      - run: npm run build
        env:
          VITE_API_URL: /api
      - run: npx eslint src || true
